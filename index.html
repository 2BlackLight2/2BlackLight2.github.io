<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Координаты на карте</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    #app {
      display: flex;
      height: 100%;
      position: relative;
    }
    /* Панель управления */
    .sidebar {
      width: 360px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 2px 0 10px rgba(0,0,0,0.2);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 15px;
      gap: 15px;
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }
    .sidebar.collapsed {
      transform: translateX(-100%);
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
    }
    .toggle-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1100;
      background: white;
      border: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 18px;
      cursor: pointer;
      display: none;
    }
    /* Карта */
    #map {
      flex: 1;
      height: 100%;
    }
    /* Форма */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-row label {
      width: 80px;
      font-weight: 500;
    }
    .input-row input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #1976d2;
      color: white;
    }
    .btn-primary:hover {
      background: #1565c0;
    }
    .btn-success {
      background: #2e7d32;
      color: white;
    }
    .btn-success:hover {
      background: #1b5e20;
    }
    .btn-warning {
      background: #f57c00;
      color: white;
    }
    .btn-warning:hover {
      background: #e65100;
    }
    .btn-danger {
      background: #c62828;
      color: white;
    }
    .btn-danger:hover {
      background: #b71c1c;
    }
    .btn-outline {
      background: white;
      border: 1px solid #1976d2;
      color: #1976d2;
    }
    .btn-outline:hover {
      background: #e3f2fd;
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    /* Таблица расстояний */
    .distance-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 5px;
    }
    .distance-table th, .distance-table td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: center;
    }
    .distance-table th {
      background: #f5f5f5;
      font-weight: 600;
    }
    .close-point {
      background-color: #ffebee;
      color: #b71c1c;
      font-weight: bold;
    }
    .warning-box {
      background: #ffebee;
      border-left: 4px solid #c62828;
      padding: 10px;
      border-radius: 4px;
      color: #b71c1c;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hidden {
      display: none;
    }
    .select-pair {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .select-pair select {
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .btn, .select-pair select, .input-row input { min-height: 44px; }
    .select-pair select { flex: 1; min-width: 120px; font-size: 15px; }
    .layer-toggles label { display:flex; align-items:center; gap:8px; min-height:40px; font-size:14px; }
    .layer-toggles input { width:22px; height:22px; }
    .swatch { display:inline-block; width:14px; height:14px; border-radius:50%; }
    #status { font-size:12px; color:#555; }
    #status.error { color:#c62828; }
    #proximityBanner {
      position:absolute; top:10px; left:50%; transform:translateX(-50%);
      z-index:1200; max-width:min(92vw,520px); background:#c62828; color:#fff;
      padding:10px 14px; border-radius:8px; box-shadow:0 3px 10px rgba(0,0,0,.35);
      font-size:14px; line-height:1.35; max-height:40vh; overflow-y:auto;
    }
    #proximityBanner .close-banner { float:right; background:none; border:none; color:#fff; font-size:20px; margin-left:8px; cursor:pointer; min-width:32px; min-height:32px; }
    .map-btn {
      position:absolute; right:10px; z-index:1100; width:48px; height:48px;
      border-radius:50%; border:none; background:#fff; font-size:22px;
      box-shadow:0 2px 6px rgba(0,0,0,.35); cursor:pointer;
    }
    #locateBtn { bottom:30px; }
    #locateBtn.active { background:#1976d2; color:#fff; }
    /* Адаптация для мобильных: панель становится нижней шторкой */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute; left: 0; right: 0; bottom: 0; top: auto;
        width: 100%; max-height: 60vh; border-radius: 14px 14px 0 0;
        box-shadow: 0 -2px 12px rgba(0,0,0,0.25); padding: 12px 14px 20px;
      }
      .sidebar.collapsed { transform: translateY(100%); position:absolute; top:auto; left:0; right:0; bottom:0; }
      .sidebar h2 { font-size: 18px; }
      .toggle-btn { display: block; min-width:48px; min-height:48px; font-size:22px; }
      .input-row input { font-size: 16px; }
      .btn { font-size: 15px; flex: 1 1 auto; }
      #locateBtn { bottom: calc(60vh + 14px); transition: bottom .3s; }
      body.sheet-collapsed #locateBtn { bottom: 30px; }
      #proximityBanner { top: 66px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Кнопка для мобильного меню -->
    <button class="toggle-btn" id="toggleSidebar" aria-label="Меню">☰</button>

    <!-- Боковая панель -->
    <div class="sidebar" id="sidebar">
      <h2>📍 Точки и расстояния</h2>

      <!-- Форма ввода -->
      <div class="input-group">
        <div class="input-row">
          <label>Широта:</label>
          <input type="text" inputmode="decimal" autocomplete="off" id="latInput" placeholder="59.9343" value="59.9343">
        </div>
        <div class="input-row">
          <label>Долгота:</label>
          <input type="text" inputmode="decimal" autocomplete="off" id="lngInput" placeholder="30.3351" value="30.3351">
        </div>
        <button class="btn btn-primary" id="addPointBtn">➕ Добавить точку</button>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;min-height:40px;">
          <input type="checkbox" id="tapAddToggle" checked style="width:22px;height:22px;"> Добавлять точку касанием карты
        </label>
      </div>

      <!-- Слои опасных объектов -->
      <div class="layer-toggles">
        <strong>Объекты рядом (радиус 50 м)</strong>
        <label><input type="checkbox" id="layerGov" checked> <span class="swatch" style="background:#6a1b9a"></span> Органы власти и правоохранительные</label>
        <label><input type="checkbox" id="layerKids" checked> <span class="swatch" style="background:#ef6c00"></span> Места скопления детей</label>
        <div id="status">Приблизьте карту (масштаб ≥ 14) для загрузки объектов.</div>
        <div id="pointProximity" class="warning-box hidden"></div>
      </div>

      <!-- Кнопки управления сохранением -->
      <div class="button-row">
        <button class="btn btn-outline" id="saveBtn">💾 Сохранить</button>
        <button class="btn btn-outline" id="loadBtn">📂 Загрузить</button>
        <button class="btn btn-danger" id="clearBtn">🗑 Очистить всё</button>
      </div>

      <!-- Предупреждение о близких точках -->
      <div id="warningContainer" class="warning-box hidden">
        ⚠️ Обнаружены точки на расстоянии менее 25 м!
      </div>

      <!-- Выбор двух точек для отображения расстояния -->
      <div class="select-pair">
        <select id="pointASelect"><option value="">Точка А</option></select>
        <select id="pointBSelect"><option value="">Точка Б</option></select>
        <button class="btn btn-outline" id="calcDistanceBtn">📏 Показать расстояние</button>
        <span id="pairDistanceResult" style="font-weight:bold; margin-left:5px;"></span>
      </div>

      <!-- Таблица всех попарных расстояний -->
      <div style="overflow-x:auto;">
        <table class="distance-table" id="distanceTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <small style="color:#666;">Красная ячейка – расстояние < 25 м</small>
    </div>

    <!-- Карта -->
    <div id="map"></div>
    <div id="proximityBanner" class="hidden" role="alert" aria-live="assertive"></div>
    <button class="map-btn" id="locateBtn" title="Моё местоположение" aria-label="Моё местоположение">📍</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function() {
      // ---------- Хранилище точек ----------
      const STORAGE_KEY = 'map_points_data';
      let points = []; // Массив объектов { id, lat, lng }

      // ---------- Карта ----------
      const map = L.map('map').setView([59.9343, 30.3351], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      // Группа маркеров
      const markerGroup = L.layerGroup().addTo(map);

      // ---------- Вспомогательные функции ----------
      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
      }

      // Гаверсинус (расстояние в метрах)
      function haversineDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000; // Радиус Земли в метрах
        const toRad = (deg) => deg * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat/2) ** 2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                  Math.sin(dLon/2) ** 2;
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

      // Поиск пар с расстоянием < 25 м
      function findClosePairs(pts, threshold = 25) {
        const pairs = [];
        for (let i = 0; i < pts.length; i++) {
          for (let j = i + 1; j < pts.length; j++) {
            const dist = haversineDistance(pts[i].lat, pts[i].lng, pts[j].lat, pts[j].lng);
            if (dist < threshold) {
              pairs.push({ i, j, dist });
            }
          }
        }
        return pairs;
      }

      // Обновление маркеров на карте (синие – обычные, красные – близкие)
      function updateMarkers(closeIndices) {
        markerGroup.clearLayers();
        const closeSet = new Set(closeIndices);
        points.forEach((p, idx) => {
          const color = closeSet.has(idx) ? 'red' : '#1976d2';
          const marker = L.circleMarker([p.lat, p.lng], {
            radius: 8,
            fillColor: color,
            color: '#fff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(markerGroup);
          marker.bindPopup(`Точка ${idx+1}<br>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`);
        });
      }

      // Заполнение выпадающих списков
      function populateSelects() {
        const selectA = document.getElementById('pointASelect');
        const selectB = document.getElementById('pointBSelect');
        selectA.innerHTML = '<option value="">Точка А</option>';
        selectB.innerHTML = '<option value="">Точка Б</option>';
        points.forEach((p, idx) => {
          const option = document.createElement('option');
          option.value = idx;
          option.textContent = `Точка ${idx+1} (${p.lat.toFixed(4)}, ${p.lng.toFixed(4)})`;
          selectA.appendChild(option.cloneNode(true));
          selectB.appendChild(option);
        });
      }

      // Обновление таблицы расстояний
      function updateDistanceTable(closePairs) {
        const table = document.getElementById('distanceTable');
        const thead = table.querySelector('thead');
        const tbody = table.querySelector('tbody');
        thead.innerHTML = '';
        tbody.innerHTML = '';

        if (points.length === 0) {
          thead.innerHTML = '<tr><th>Нет точек</th></tr>';
          return;
        }

        // Заголовок
        let headerRow = '<tr><th>Точка</th>';
        points.forEach((_, i) => {
          headerRow += `<th>${i+1}</th>`;
        });
        headerRow += '</tr>';
        thead.innerHTML = headerRow;

        // Строки
        for (let i = 0; i < points.length; i++) {
          let row = `<td><strong>${i+1}</strong></td>`;
          for (let j = 0; j < points.length; j++) {
            if (i === j) {
              row += '<td>—</td>';
            } else {
              const dist = haversineDistance(points[i].lat, points[i].lng, points[j].lat, points[j].lng);
              const isClose = closePairs.some(pair =>
                (pair.i === i && pair.j === j) || (pair.i === j && pair.j === i)
              );
              const cellClass = isClose ? 'class="close-point"' : '';
              row += `<td ${cellClass}>${dist.toFixed(1)} м</td>`;
            }
          }
          tbody.innerHTML += `<tr>${row}</tr>`;
        }
      }

      // Отображение предупреждения
      function updateWarning(closePairs) {
        const warningDiv = document.getElementById('warningContainer');
        if (closePairs.length > 0) {
          warningDiv.classList.remove('hidden');
          warningDiv.innerHTML = `⚠️ Обнаружены точки на расстоянии менее 25 м! (${closePairs.length} пар)`;
        } else {
          warningDiv.classList.add('hidden');
        }
      }

      // Полное обновление UI
      function refreshUI() {
        const closePairs = findClosePairs(points);
        const closeIndices = closePairs.flatMap(p => [p.i, p.j]);

        updateMarkers(closeIndices);
        populateSelects();
        updateDistanceTable(closePairs);
        updateWarning(closePairs);
        document.getElementById('pairDistanceResult').textContent = '';
        if (typeof checkProximity === 'function') checkProximity(false);
      }

      // Сохранение в localStorage
      function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(points));
        alert('Точки сохранены в памяти браузера.');
      }

      function loadFromStorage() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            points = JSON.parse(raw);
            refreshUI();
            if (points.length > 0) {
              const last = points[points.length-1];
              map.setView([last.lat, last.lng], 14);
            }
            alert('Точки загружены.');
          } catch (e) {
            alert('Ошибка загрузки данных.');
          }
        } else {
          alert('Сохранённых точек не найдено.');
        }
      }

      function clearAll() {
        if (confirm('Удалить все точки?')) {
          points = [];
          markerGroup.clearLayers();
          refreshUI();
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      // Добавление точки
      function addPoint() {
        const latInput = document.getElementById('latInput');
        const lngInput = document.getElementById('lngInput');
        const lat = parseFloat(String(latInput.value).replace(',', '.'));
        const lng = parseFloat(String(lngInput.value).replace(',', '.'));

        if (isNaN(lat) || isNaN(lng)) {
          alert('Введите корректные координаты.');
          return;
        }
        if (lat < -90 || lat > 90) {
          alert('Широта должна быть от -90 до 90.');
          return;
        }
        if (lng < -180 || lng > 180) {
          alert('Долгота должна быть от -180 до 180.');
          return;
        }

        points.push({ id: generateId(), lat, lng });
        refreshUI();
        map.setView([lat, lng], map.getZoom());
        // Очистка полей (опционально)
        latInput.value = '';
        lngInput.value = '';
      }

      // Показать расстояние между выбранными точками
      function showPairDistance() {
        const idxA = document.getElementById('pointASelect').value;
        const idxB = document.getElementById('pointBSelect').value;
        const resultSpan = document.getElementById('pairDistanceResult');
        if (idxA === '' || idxB === '') {
          resultSpan.textContent = 'Выберите обе точки.';
          return;
        }
        if (idxA === idxB) {
          resultSpan.textContent = 'Выбрана одна и та же точка.';
          return;
        }
        const a = points[parseInt(idxA)];
        const b = points[parseInt(idxB)];
        const dist = haversineDistance(a.lat, a.lng, b.lat, b.lng);
        resultSpan.textContent = `${dist.toFixed(2)} м`;
      }

      // Автозагрузка при старте
      function autoLoad() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            points = JSON.parse(raw);
            refreshUI();
          } catch (e) {}
        }
      }


      // ---------- Добавление точки касанием карты ----------
      map.on('click', (e) => {
        if (!document.getElementById('tapAddToggle').checked) return;
        points.push({ id: generateId(), lat: e.latlng.lat, lng: e.latlng.lng });
        refreshUI();
      });

      // ---------- Опасные объекты (Overpass API) ----------
      const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';
      const PROX_RADIUS = 50;
      const CATS = {
        gov:  { name: 'Органы власти и правоохранительные', color: '#6a1b9a' },
        kids: { name: 'Места скопления детей', color: '#ef6c00' }
      };
      const layers = { gov: L.layerGroup().addTo(map), kids: L.layerGroup().addTo(map) };
      const objects = new Map();      // key "type/id" -> {lat,lng,cat,name}
      const loadedCells = new Set();  // загруженные ячейки сетки 0.01°
      const pendingCells = new Set();
      const CELL = 0.01;
      const statusEl = document.getElementById('status');

      function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.classList.toggle('error', !!isError);
      }
      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }
      const TYPE_RU = {
        police: 'Полиция', townhall: 'Администрация', courthouse: 'Суд', prison: 'Тюрьма',
        government: 'Госучреждение', school: 'Школа', kindergarten: 'Детский сад',
        childcare: 'Детский центр', playground: 'Детская площадка'
      };
      function classify(t) {
        if (['police','townhall','courthouse','prison'].includes(t.amenity)) return ['gov', TYPE_RU[t.amenity]];
        if (t.office === 'government') return ['gov', TYPE_RU.government];
        if (t.military) return ['gov', 'Военный объект'];
        if (['school','kindergarten','childcare'].includes(t.amenity)) return ['kids', TYPE_RU[t.amenity]];
        if (t.leisure === 'playground') return ['kids', TYPE_RU.playground];
        if (['school','kindergarten'].includes(t.building)) return ['kids', TYPE_RU[t.building]];
        return null;
      }
      function buildQuery(s, w, n, e) {
        const b = `(${s},${w},${n},${e})`;
        return `[out:json][timeout:25];(
nwr["amenity"~"^(police|townhall|courthouse|prison)$"]${b};
nwr["office"="government"]${b};
nwr["military"]${b};
nwr["amenity"~"^(school|kindergarten|childcare)$"]${b};
nwr["leisure"="playground"]${b};
nwr["building"~"^(school|kindergarten)$"]${b};
);out center tags;`;
      }
      function addObject(el) {
        const key = el.type + '/' + el.id;
        if (objects.has(key)) return;
        const lat = el.lat != null ? el.lat : (el.center && el.center.lat);
        const lng = el.lon != null ? el.lon : (el.center && el.center.lon);
        if (lat == null || lng == null) return;
        const t = el.tags || {};
        const c = classify(t);
        if (!c) return;
        const [cat, typeName] = c;
        const name = t.name || t['name:ru'] || typeName;
        const obj = { lat, lng, cat, name, typeName };
        objects.set(key, obj);
        const color = CATS[cat].color;
        const popup = `<b>${escapeHtml(name)}</b><br>${escapeHtml(typeName)}<br><small>${escapeHtml(CATS[cat].name)}</small>`;
        L.circle([lat, lng], { radius: PROX_RADIUS, color, weight: 1, fillColor: color, fillOpacity: 0.15, interactive: false }).addTo(layers[cat]);
        L.circleMarker([lat, lng], { radius: 6, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 }).bindPopup(popup).addTo(layers[cat]);
      }
      async function fetchCells(cells) {
        cells = cells.filter(c => !loadedCells.has(c) && !pendingCells.has(c));
        if (!cells.length) return;
        let s = Infinity, w = Infinity, n = -Infinity, e = -Infinity;
        cells.forEach(c => {
          const [i, j] = c.split(':').map(Number);
          s = Math.min(s, i * CELL); n = Math.max(n, (i + 1) * CELL);
          w = Math.min(w, j * CELL); e = Math.max(e, (j + 1) * CELL);
        });
        cells.forEach(c => pendingCells.add(c));
        setStatus('Загрузка объектов…');
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 30000);
        try {
          const res = await fetch(OVERPASS_URL, {
            method: 'POST',
            body: 'data=' + encodeURIComponent(buildQuery(s.toFixed(4), w.toFixed(4), n.toFixed(4), e.toFixed(4))),
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            signal: ctrl.signal
          });
          if (res.status === 429) throw new Error('слишком много запросов, повторите позже');
          if (!res.ok) throw new Error('сервер ответил ' + res.status);
          const data = await res.json();
          (data.elements || []).forEach(addObject);
          cells.forEach(c => loadedCells.add(c));
          setStatus(`Загружено объектов: ${objects.size}`);
          checkProximity(false);
        } catch (err) {
          const msg = err.name === 'AbortError' ? 'превышено время ожидания' : (err.message || 'ошибка сети');
          setStatus('Не удалось загрузить объекты: ' + msg + '. Повтор при следующем перемещении карты.', true);
        } finally {
          clearTimeout(timer);
          cells.forEach(c => pendingCells.delete(c));
        }
      }
      function cellsForBounds(s, w, n, e) {
        const cells = [];
        for (let i = Math.floor(s / CELL); i <= Math.floor(n / CELL); i++)
          for (let j = Math.floor(w / CELL); j <= Math.floor(e / CELL); j++)
            cells.push(i + ':' + j);
        return cells;
      }
      let debounceTimer = null;
      function scheduleViewFetch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          if (map.getZoom() < 14) {
            setStatus(objects.size ? `Загружено объектов: ${objects.size}. Приблизьте карту для загрузки новых.` : 'Приблизьте карту (масштаб ≥ 14) для загрузки объектов.');
            return;
          }
          const b = map.getBounds();
          const cells = cellsForBounds(b.getSouth(), b.getWest(), b.getNorth(), b.getEast());
          if (cells.length > 30) return;
          fetchCells(cells);
        }, 800);
      }
      map.on('moveend', scheduleViewFetch);
      scheduleViewFetch();

      function toggleLayer(id, cat) {
        document.getElementById(id).addEventListener('change', (ev) => {
          if (ev.target.checked) layers[cat].addTo(map); else map.removeLayer(layers[cat]);
        });
      }
      toggleLayer('layerGov', 'gov');
      toggleLayer('layerKids', 'kids');

      function nearbyObjects(lat, lng) {
        const res = [];
        objects.forEach(o => {
          const d = haversineDistance(lat, lng, o.lat, o.lng);
          if (d <= PROX_RADIUS) res.push({ ...o, dist: d });
        });
        return res.sort((a, b) => a.dist - b.dist);
      }

      // ---------- Проверка близости и предупреждения ----------
      const banner = document.getElementById('proximityBanner');
      let userPos = null;
      let lastAlertKey = '';
      let bannerDismissedKey = null;
      function describe(o) {
        return `<b>${escapeHtml(CATS[o.cat].name)}</b>: ${escapeHtml(o.name)}${o.name !== o.typeName ? ' (' + escapeHtml(o.typeName) + ')' : ''} — ${o.dist.toFixed(0)} м`;
      }
      function checkProximity(fromGps) {
        const lines = [];
        let userNear = [];
        if (userPos) {
          userNear = nearbyObjects(userPos.lat, userPos.lng);
          userNear.forEach(o => lines.push('📍 Вы рядом: ' + describe(o)));
        }
        const pointLines = [];
        points.forEach((p, idx) => {
          nearbyObjects(p.lat, p.lng).forEach(o => pointLines.push(`Точка ${idx + 1}: ` + describe(o)));
        });
        lines.push(...pointLines);

        const pp = document.getElementById('pointProximity');
        if (pointLines.length) { pp.innerHTML = '⚠️ ' + pointLines.join('<br>'); pp.classList.remove('hidden'); }
        else pp.classList.add('hidden');

        const key = lines.join('|');
        if (lines.length && key !== bannerDismissedKey) {
          banner.innerHTML = '<button class="close-banner" aria-label="Закрыть">×</button>⚠️ <b>Внимание! В радиусе 50 м:</b><br>' + lines.join('<br>');
          banner.classList.remove('hidden');
          banner.querySelector('.close-banner').onclick = () => { bannerDismissedKey = key; banner.classList.add('hidden'); };
        } else if (!lines.length) {
          banner.classList.add('hidden');
          bannerDismissedKey = null;
        }

        // Вибрация только для живого местоположения и только при появлении новых объектов
        const userKey = userNear.map(o => o.lat + ',' + o.lng).join('|');
        if (userNear.length && userKey !== lastAlertKey && navigator.vibrate) {
          navigator.vibrate([300, 150, 300, 150, 300]);
        }
        lastAlertKey = userKey;
      }

      // ---------- Моё местоположение ----------
      const locateBtn = document.getElementById('locateBtn');
      let watchId = null, userMarker = null, accuracyCircle = null, firstFix = true, lastFetchPos = null;
      function stopWatch() {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        watchId = null; userPos = null;
        if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
        if (accuracyCircle) { map.removeLayer(accuracyCircle); accuracyCircle = null; }
        locateBtn.classList.remove('active');
        checkProximity(false);
      }
      locateBtn.addEventListener('click', () => {
        if (!('geolocation' in navigator)) { alert('Геолокация не поддерживается этим браузером.'); return; }
        if (watchId !== null) {
          if (userPos) map.setView([userPos.lat, userPos.lng], Math.max(map.getZoom(), 16));
          else stopWatch();
          return;
        }
        firstFix = true;
        locateBtn.classList.add('active');
        setStatus('Определение местоположения…');
        watchId = navigator.geolocation.watchPosition((pos) => {
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          userPos = { lat, lng };
          if (!userMarker) {
            accuracyCircle = L.circle([lat, lng], { radius: pos.coords.accuracy, color: '#1e88e5', weight: 1, fillOpacity: 0.1, interactive: false }).addTo(map);
            userMarker = L.circleMarker([lat, lng], { radius: 9, color: '#fff', weight: 3, fillColor: '#1e88e5', fillOpacity: 1 })
              .bindPopup('Вы здесь').addTo(map);
          } else {
            userMarker.setLatLng([lat, lng]);
            accuracyCircle.setLatLng([lat, lng]).setRadius(pos.coords.accuracy);
          }
          if (firstFix) { map.setView([lat, lng], Math.max(map.getZoom(), 16)); firstFix = false; }
          if (!lastFetchPos || haversineDistance(lat, lng, lastFetchPos.lat, lastFetchPos.lng) > 100) {
            lastFetchPos = { lat, lng };
            fetchCells(cellsForBounds(lat - 0.004, lng - 0.007, lat + 0.004, lng + 0.007));
          }
          checkProximity(true);
        }, (err) => {
          const msgs = { 1: 'доступ к геолокации запрещён', 2: 'местоположение недоступно', 3: 'превышено время ожидания' };
          setStatus('Геолокация: ' + (msgs[err.code] || err.message), true);
          if (err.code === 1) { alert('Разрешите доступ к геолокации в настройках браузера.'); stopWatch(); }
        }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
      });
      locateBtn.addEventListener('dblclick', stopWatch);

      // ---------- Привязка событий ----------
      document.getElementById('addPointBtn').addEventListener('click', addPoint);
      document.getElementById('saveBtn').addEventListener('click', saveToStorage);
      document.getElementById('loadBtn').addEventListener('click', loadFromStorage);
      document.getElementById('clearBtn').addEventListener('click', clearAll);
      document.getElementById('calcDistanceBtn').addEventListener('click', showPairDistance);

      // Мобильное меню
      const sidebar = document.getElementById('sidebar');
      const toggleBtn = document.getElementById('toggleSidebar');
      toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '☰' : '✕';
        document.body.classList.toggle('sheet-collapsed', sidebar.classList.contains('collapsed'));
        // Перерисовка карты при изменении размера контейнера
        setTimeout(() => map.invalidateSize(), 300);
      });

      // На узких экранах шторка изначально свёрнута
      if (window.matchMedia('(max-width: 768px)').matches) {
        sidebar.classList.add('collapsed');
        document.body.classList.add('sheet-collapsed');
      }
      // Старт
      autoLoad();
    })();
  </script>
</body>
</html>
